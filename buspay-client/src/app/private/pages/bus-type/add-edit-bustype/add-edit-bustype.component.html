<div>
  <form class="bustype-form" [formGroup]="busTypeForm">
    <div class="add-edit-fields">
      <label>BUS TYPE</label>
      <app-text-box
        [placeholder]="'Bus Type..'"
        formControlName="busType"
      ></app-text-box>
      <span
        *ngIf="
          busTypeForm.controls['busType'].invalid &&
          busTypeForm.controls['busType'].touched
        "
        class="text-danger"
      >
        Required
      </span>
    </div>

    <div class="add-edit-fields">
      <label>FARE KM</label>
      <app-text-box
        [placeholder]="'Fare KM..'"
        formControlName="fareKm"
      ></app-text-box>
      <span
        *ngIf="
          busTypeForm.controls['fareKm'].invalid &&
          busTypeForm.controls['fareKm'].touched
        "
        class="text-danger"
      >
        Required
      </span>
    </div>

    <div class="add-edit-fields">
      <label>MINIMUM CHARGE</label>
      <app-text-box
        [placeholder]="'Minimum Charge..'"
        formControlName="minCharge"
      ></app-text-box>
      <span
        *ngIf="
          busTypeForm.controls['minCharge'].invalid &&
          busTypeForm.controls['minCharge'].touched
        "
        class="text-danger"
      >
        Required
      </span>
    </div>

    <div class="add-edit-fields">
      <label>FARE PER KM</label>
      <app-text-box
        [placeholder]="'Fare per Km'"
        formControlName="farePerKm"
      ></app-text-box>
      <span
        *ngIf="
          busTypeForm.controls['farePerKm'].invalid &&
          busTypeForm.controls['farePerKm'].touched
        "
        class="text-danger"
      >
        Required
      </span>
    </div>
  </form>
</div>
